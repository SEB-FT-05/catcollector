{% extends 'base.html' %}

{% block content %}

<h1>Cat Detail</h1>

  <div class="card">
    <div class="card-content">

       <div class="flex-container">
            <div>
              <span class="card-title">{{ cat.name }}</span>
              <p>Breed: {{ cat.breed }}</p>
              <p>Description: {{ cat.description }}</p>

              {% if cat.age > 0 %}
                <p>Age: {{ cat.age }}</p>
              {% else %}
                <p>Age: Kitten</p>
              {% endif %}

            </div>

            <div>
                {% load static %}
                <img width="100px" height="100px" src={% static cat.image|cut:'main_app/static/' %} />
            </div>

    </div>

    <div class="card-action">
      <a href="{% url 'cats_update' cat.id %}">Edit</a>
      <a href="{% url 'cats_delete' cat.id %}">Delete</a>
    </div>
  </div>

{% endblock %}
